# Local Postgres for development: `npm run db:local` (data kept in the fbr_pgdata volume)
services:
  db:
    image: postgres:16-alpine
    container_name: fbr-local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fbr_billing
    ports:
      - "54329:5432"
    volumes:
      - fbr_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fbr_pgdata:
